  - id: pz_mapping_tools_gpl2
    component: PZ Mapping Tools
    licence: GPL-2.0
    handling: External tool, not redistributed.
    source: .planning/research/STACK.md
  - id: knoxmap_own_mit
    component: KnoxMap own additions (knoxbuild/, tools/)
    licence: MIT
    handling: Used as an external tool.
    source: KnoxMap LICENSES.md
  - id: pz_game_assets
    component: Project Zomboid tiles and art
    licence: The Indie Stone copyright
    handling: Never redistributed. Tools read them from the player's own install.
